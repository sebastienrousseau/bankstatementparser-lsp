name: Bug Report
description: Report a reproducible problem in bankstatementparser-lsp
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: input
    id: version
    attributes:
      label: bankstatementparser-lsp Version
      placeholder: "0.0.10"
    validations:
      required: true
  - type: input
    id: bankstatementparser_version
    attributes:
      label: bankstatementparser Version
      placeholder: "0.0.10"
    validations:
      required: true
  - type: dropdown
    id: python_version
    attributes:
      label: Python Version
      options:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
    validations:
      required: true
  - type: dropdown
    id: editor
    attributes:
      label: Editor / LSP Client
      options:
        - Neovim (nvim-lspconfig)
        - Neovim (built-in vim.lsp.config)
        - VS Code (generic LSP)
        - Helix
        - Emacs (lsp-mode / eglot)
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: document
    attributes:
      label: MT940 Document
      description: |
        The smallest MT940 text that shows the problem (redact any
        sensitive account numbers or balances - placeholder data is fine).
      render: text
    validations:
      required: true
  - type: textarea
    id: error_output
    attributes:
      label: Diagnostics Or Error Output
      description: The diagnostics the editor showed (or should have shown), or the server's stack trace.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything Else
      description: Logs, server stderr, editor LSP config, etc.
