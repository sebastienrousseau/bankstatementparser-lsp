name: Feature Request
description: Suggest a new MT940 diagnostic or LSP feature for bankstatementparser-lsp
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: |
        What can't you do today with bankstatementparser-lsp? If this surfaces an
        existing bankstatementparser helper, link to it.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: |
        Sketch the diagnostic or LSP feature: the LSP method
        (textDocument/*), what it reports, and its severity. Reference the parent bankstatementparser API surface where
        relevant.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Real-World Use Case
      description: How would you use this while editing a statement?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: LSP Surface
      options:
        - Diagnostics
        - Code actions
        - Hover / completion
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
  - type: textarea
    id: contribution
    attributes:
      label: Willingness To Contribute
      description: Could you take a stab at the implementation or tests?
